# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Thème Orbe : fond, polices Archivo et JetBrains Mono, menu graphique.
# Sans le thème (polices introuvables), GRUB garde la console texte.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set orbe_theme="/boot/grub/themes/orbe"
if loadfont "${orbe_theme}/archivo-regular-22.pf2" ; then
    loadfont "${orbe_theme}/archivo-semibold-22.pf2"
    loadfont "${orbe_theme}/archivo-semibold-48.pf2"
    loadfont "${orbe_theme}/jetbrains-mono-16.pf2"
    set gfxmode="1920x1080,1280x720,auto"
    terminal_input console
    terminal_output gfxterm
    set theme="${orbe_theme}/theme.txt"
    export theme
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=orbe
timeout=10
timeout_style=menu


# Menu entries

menuentry "Démarrer Orbe OS (${archiso_platform})" --class orbe --class gnu-linux --class gnu --class os --id 'orbe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 plymouth.use-simpledrm %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Démarrer Orbe OS avec pilotes libres (${archiso_platform})" --class orbe --class gnu-linux --class gnu --class os --id 'orbe-libre' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% orbe.gpu=libre quiet splash loglevel=3 plymouth.use-simpledrm %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Démarrer Orbe OS avec lecteur d'écran (${archiso_platform})" --hotkey s --class orbe --class gnu-linux --class gnu --class os --id 'orbe-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Tester la mémoire (Memtest86+)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Tester la mémoire (Memtest86+)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'Shell UEFI' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'Réglages du micrologiciel UEFI' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Éteindre' --class shutdown --class poweroff {
    echo 'Extinction...'
    halt
}

menuentry 'Redémarrer' --class reboot --class restart {
    echo 'Redémarrage...'
    reboot
}


