# greetd de la session live : orbe-session ouvre tout seul le bureau (ou le mode jeu) pour l'utilisateur orbe.

[terminal]
vt = 1

# Après une déconnexion : invite texte, en attendant le greeter Orbe (étape 6).
[default_session]
command = "agreety --cmd orbe-session"
user = "greeter"

[initial_session]
command = "orbe-session"
user = "orbe"
