# greetd de la session live : orbe-session ouvre tout seul le bureau (ou le mode jeu) pour l'utilisateur orbe.

[terminal]
vt = 1

# Après une déconnexion : écran de connexion Orbe (le compte live n'a pas de mot de passe : Entrée suffit).
[default_session]
command = "orbe-greeter"
user = "greeter"

[initial_session]
command = "orbe-session"
user = "orbe"
