#
# /etc/pacman.conf d'Orbe OS : celui d'Arch, avec le dépôt multilib actif (Steam, Proton,
# pilotes 32 bits). Le dépôt [orbe] y sera ajouté quand il sera hébergé (docs/installation.md).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
