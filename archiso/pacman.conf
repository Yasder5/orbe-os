#
# pacman.conf utilisé par mkarchiso pour construire l'ISO Orbe OS.
# Le système live garde le pacman.conf du paquet pacman.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Dépôt local des paquets Orbe, produit par build.sh et monté dans le conteneur.
# Placé en premier pour qu'une révision Orbe d'un paquet passe avant celle d'Arch.
[orbe]
SigLevel = Optional TrustAll
Server = file:///orbe/out/repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32 bits : Steam, Proton, pilotes lib32 pour le jeu.
[multilib]
Include = /etc/pacman.d/mirrorlist
