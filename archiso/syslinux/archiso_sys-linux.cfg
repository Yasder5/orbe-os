LABEL orbe
TEXT HELP
Démarre la session live d'Orbe OS en BIOS.
Permet d'essayer Orbe OS, de l'installer ou de réparer un système.
ENDTEXT
MENU LABEL ^Démarrer Orbe OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL orbespeech
TEXT HELP
Démarre la session live d'Orbe OS en BIOS avec le lecteur d'écran speakup.
ENDTEXT
MENU LABEL Démarrer avec lecteur d'écran
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
