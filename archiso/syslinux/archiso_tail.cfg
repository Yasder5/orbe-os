LABEL existing
TEXT HELP
Démarre un système déjà installé.
TAB pour modifier le disque et la partition.
ENDTEXT
MENU LABEL Démarrer le système installé
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Tester la mémoire (Memtest86+)
LINUX /boot/memtest86+/memtest

# https://wiki.syslinux.org/wiki/index.php/Hdt_(Hardware_Detection_Tool)
LABEL hdt
MENU LABEL Informations matérielles (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
TEXT HELP
Redémarre l'ordinateur.
ENDTEXT
MENU LABEL Redémarrer
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Éteint l'ordinateur.
ENDTEXT
MENU LABEL Éteindre
COM32 poweroff.c32
