SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Orbe OS
MENU BACKGROUND splash.png

# Menu à gauche (l'orbe du fond occupe la droite), écran 640x480 en colonnes de 8 px.
MENU WIDTH 50
MENU MARGIN 3
MENU HSHIFT 2
MENU ROWS 8
MENU VSHIFT 5
MENU TABMSGROW 16
MENU CMDLINEROW 16
MENU TIMEOUTROW 17
MENU HELPMSGROW 20
MENU HELPMSGENDROW 28

MENU TABMSG Tab : modifier les options
MENU AUTOBOOT Démarrage automatique dans # s

# Palette Orbe, couleurs en #AARRGGBB. Référence : https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32
MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;40   #00000000 #00000000 none
MENU COLOR title        1;37;40 #fff5f5f0 #00000000 none
MENU COLOR sel          7;37;40 #ff0a0a0a #ffd3fd50 none
MENU COLOR hotsel       1;7;37;40 #ff0a0a0a #ffd3fd50 none
MENU COLOR unsel        37;40   #fff5f5f0 #00000000 none
MENU COLOR hotkey       1;37;40 #ffd3fd50 #00000000 none
MENU COLOR disabled     1;30;40 #ff8f8f8a #00000000 none
MENU COLOR scrollbar    30;40   #ff3a3a37 #00000000 none
MENU COLOR help         37;40   #ff8f8f8a #00000000 none
MENU COLOR timeout_msg  37;40   #ff8f8f8a #00000000 none
MENU COLOR timeout      1;37;40 #ffd3fd50 #00000000 none
MENU COLOR msg07        37;40   #fff5f5f0 #00000000 none
MENU COLOR tabmsg       37;40   #ff8f8f8a #00000000 none
MENU COLOR cmdmark      1;37;40 #ffd3fd50 #00000000 none
MENU COLOR cmdline      37;40   #fff5f5f0 #00000000 none

MENU CLEAR
MENU IMMEDIATE
