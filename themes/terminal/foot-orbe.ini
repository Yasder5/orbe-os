# Palette Orbe pour le terminal foot.
# Contraste AA (4,5:1 minimum) sur le fond #0a0a0a pour toutes les teintes de texte.
# Chargée par ~/.config/foot/foot.ini (include=/usr/share/orbe/foot/orbe.ini).

[main]
font=JetBrains Mono:size=11
pad=14x14 center

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=0a0a0a
foreground=f5f5f0
selection-background=d3fd50
selection-foreground=0a0a0a
cursor=0a0a0a d3fd50
urls=d3fd50

# Noir, rouge (danger), vert (accent), jaune, bleu, magenta, cyan, blanc
regular0=262624
regular1=ff6b5a
regular2=d3fd50
regular3=f5d76e
regular4=7cb4ff
regular5=d39cff
regular6=6fdcd2
regular7=c9c9c3

bright0=8f8f8a
bright1=ff8f80
bright2=e1ff80
bright3=ffe59a
bright4=a5cbff
bright5=e2bdff
bright6=9eece5
bright7=f5f5f0
