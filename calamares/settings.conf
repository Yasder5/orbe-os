# Installateur Orbe OS (Calamares). Copie du système live sur le disque (unpackfs), puis
# réglages du système installé : aucun téléchargement nécessaire.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       nvidia
  module:   shellprocess
  config:   shellprocess-nvidia.conf
  weight:   5

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - removeuser
  - users
  - networkcfg
  - hwclock
  - orbe
  - initcpiocfg
  - initcpio
  - plymouthcfg
  - services-systemd
  - shellprocess@nvidia
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: orbe
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
