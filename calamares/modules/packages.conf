# Paquets choisis dans « Options » : installés depuis les miroirs d'Arch si Internet répond.
# Avec Internet, le système copié est d'abord mis à jour en entier (pacman -Syu) : les paquets
# ajoutés ensuite (noyaux, pilote NVIDIA 32 bits) ont ainsi des versions qui se correspondent.
---
backend: pacman
skip_if_no_internet: true
update_db: true
ignore_update_db_error: true
update_system: true
pacman:
    num_retries: 2
    disable_download_timeout: false
    needed_only: true
