---
units:
  - name: NetworkManager
    action: enable
  - name: bluetooth
    action: enable
  - name: power-profiles-daemon
    action: enable
  - name: greetd
    action: enable
  - name: orbe-gpu-setup
    action: enable
  - name: fstrim.timer
    action: enable
  - name: systemd-timesyncd
    action: enable
  - name: snapper-cleanup.timer
    action: enable
  # Cache de pacman : garde les 3 dernières versions de chaque paquet (pacman-contrib).
  - name: paccache.timer
    action: enable
  # Détecte Windows au menu de démarrage, pour « Redémarrer sous Windows ».
  - name: orbe-windows-scan
    action: enable
  - name: snapper-timeline.timer
    action: disable
