---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - video
    - audio
    - input
    - network
    - storage
    - lp
    - name: gamemode
      must_exist: false
      system: true
sudoersGroup:    wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
displayAutologin: true
doAutologin:     false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, orbe, greeter ]
  home_permissions: "o700"
hostname:
  location: Hostnamed
  writeHostsFile: true
  template: "orbe-${product}"
  forbidden_names: [ localhost ]
