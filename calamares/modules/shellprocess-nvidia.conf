# Carte NVIDIA : pilote complet sur le système installé (bibliothèques 32 bits pour Steam et
# Proton, module pour chaque noyau choisi). Lancé après la mise à jour faite par « packages »,
# seulement si Internet répond ; sinon, Orbe OS le propose au premier démarrage
# (orbe-check-session, puis Réglages Orbe, Mode jeu). Ne bloque jamais l'installation.
---
dontChroot: false
timeout: 1800
script:
    - command: "sh -c 'ping -c1 -W3 geo.mirror.pkgbuild.com >/dev/null 2>&1 || curl -sfI --max-time 8 https://geo.mirror.pkgbuild.com >/dev/null || exit 0; orbe-nvidia --sans-maj || true'"
      timeout: 1800
