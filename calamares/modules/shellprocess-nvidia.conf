# Jeux 32 bits sur carte NVIDIA : lib32-nvidia-utils (580 Mo installé) n'est pas dans l'ISO.
# Installé seulement si une carte NVIDIA est présente et qu'Internet répond ; sinon, rien
# n'est bloqué (la commande est à relancer plus tard, voir docs/installation.md).
---
dontChroot: false
timeout: 900
script:
    - command: "sh -c 'lspci -n | grep -Eq \" 03(00|02): 10de:\" || exit 0; pacman -Sy --noconfirm --needed lib32-nvidia-utils || true'"
      timeout: 900
