# Disque : btrfs par défaut (instantanés snapper), ext4 au choix, chiffrement LUKS2 en option.
# La partition EFI est montée sur /boot : le noyau y reste lisible par GRUB, et le disque
# chiffré est ouvert par l'initramfs (mot de passe demandé par l'écran de démarrage Orbe).
# GRUB ne sait pas ouvrir LUKS2 avec argon2 : rien de chiffré ne lui est demandé.
---
efi:
    mountPoint:         "/boot"
    recommendedSize:    2GiB
    minimumSize:        1GiB
    label:              "ORBE_EFI"

userSwapChoices:
    - none
    - file
initialSwapChoice: none

luksGeneration: luks2
enableLuksAutomatedPartitioning: true
showNotEncryptedBootMessage: false

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultPartitionTableType: gpt
defaultFileSystemType:  "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
essentialMounts: [ "live-*", "control", "ventoy", "ARCHISO*", "ORBE*" ]
lvm:
    enable: false
