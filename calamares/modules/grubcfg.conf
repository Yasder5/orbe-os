---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# plymouth.use-simpledrm : écran de démarrage dès le tampon d'image du micrologiciel, sans
# attendre le pilote graphique (NVIDIA n'est pas dans l'initramfs).
kernel_params: [ "quiet", "splash", "loglevel=3", "plymouth.use-simpledrm" ]
defaults:
    GRUB_TIMEOUT: 3
    GRUB_DEFAULT: "saved"
    GRUB_SAVEDEFAULT: true
    # Menu court : « Orbe OS Linux » en tête, les variantes (secours) dans « Options avancées ».
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
    # Pas d'entrées « EFI BootNext » pour chaque entrée du micrologiciel : Windows est trouvé par os-prober.
    GRUB_DISABLE_BOOTNEXT: true
    GRUB_GFXMODE: "1920x1080,1280x720,auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/usr/share/grub/themes/orbe/theme.txt"
always_use_defaults: true
