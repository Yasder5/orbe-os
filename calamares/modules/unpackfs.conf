# Le système live (squashfs de l'ISO) est copié tel quel ; le module « orbe » enlève ensuite
# ce qui ne sert qu'à la session live.
---
unpack:
    # Image du système monté par archiso (aussi avec copytoram ou Ventoy), sans les
    # modifications faites pendant la session live.
    -   source: "/run/archiso/airootfs/"
        sourcefs: "file"
        destination: ""
