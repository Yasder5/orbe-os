# Visualiseur audio du tableau de bord : 32 barres, valeurs 0 à 1000 sur la sortie standard.
[general]
bars = 32
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
