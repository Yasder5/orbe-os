# MangoHud aux couleurs d'Orbe : compteur d'images et mesures du système pendant une partie.
# Sur le bureau : option de lancement Steam « mangohud %command% », ou MANGOHUD=1.
# En mode jeu, c'est le curseur « Performances » du menu rapide de Steam qui le règle.
# Maj droite + F12 : afficher ou masquer.
toggle_hud=Shift_R+F12
legacy_layout=false
horizontal
position=top-left
round_corners=6
background_alpha=0.85
background_color=0A0A0A
text_color=F5F5F0
font_file=/usr/share/fonts/TTF/JetBrainsMono-Regular.ttf
font_size=18

fps
frametime
frame_timing=1
frametime_color=D3FD50
gpu_stats
gpu_temp
gpu_color=D3FD50
cpu_stats
cpu_temp
cpu_color=D3FD50
vram
vram_color=8F8F8A
ram
ram_color=8F8F8A
engine_color=D3FD50
wine_color=8F8F8A
battery_color=8F8F8A
media_player_color=F5F5F0
gpu_load_change
cpu_load_change
gpu_load_color=F5F5F0,D3FD50,FF6B5A
cpu_load_color=F5F5F0,D3FD50,FF6B5A
fps_color_change
fps_color=FF6B5A,D3FD50,F5F5F0
fps_value=30,60
