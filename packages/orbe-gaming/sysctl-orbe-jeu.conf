# Réglages pour le jeu, repris de SteamOS et du wiki Arch.
# Certains jeux (anti-triche, moteurs récents) réservent un très grand nombre de zones mémoire.
vm.max_map_count = 2147483642
# Pas de ralentissement volontaire des programmes qui font des « split locks » (vieux jeux sous Proton).
kernel.split_lock_mitigate = 0
# Échange en mémoire compressée (zram) : plus rapide que le disque, donc utilisé plus volontiers.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
