# Mise en veille automatique d'Orbe OS (hypridle).
# Remplacée par ~/.config/hypr/hypridle.conf s'il existe. Jamais pendant un jeu ou une vidéo en
# plein écran (règle « idle_inhibit » de rules.lua), ni dans la session live.

general {
    lock_cmd = qs -c orbe ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min : écran assombri (portables)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min : verrouillage
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min : écran éteint
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 30 min : mise en veille
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
