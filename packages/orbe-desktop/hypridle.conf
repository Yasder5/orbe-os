# Mise en veille automatique d'Orbe OS (hypridle), valeurs par défaut.
# Réglages Orbe (page Énergie) écrit ~/.config/orbe/hypridle.conf, utilisé à la place ;
# ~/.config/hypr/hypridle.conf, écrit à la main, passe avant les deux.
# Jamais pendant un jeu ou une vidéo en plein écran (règle « idle_inhibit » de rules.lua), ni
# dans la session live. La mise en veille attend aussi la fin d'une musique, d'un téléchargement
# ou d'une partie (orbe-suspend-check).

general {
    lock_cmd = qs -c orbe ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min : écran assombri (portables)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min : verrouillage
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min : écran éteint
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 1 h : mise en veille, si rien n'est en cours
listener {
    timeout = 3600
    on-timeout = orbe-suspend-check && systemctl suspend
}
